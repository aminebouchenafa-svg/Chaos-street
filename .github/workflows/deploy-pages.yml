name: Déployer la PWA sur GitHub Pages

on:
  push:
    branches:
      - claude/game-script-review-xii58t
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Uploader le dossier app/ comme site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./app

      - name: Déployer sur Pages
        id: deployment
        uses: actions/deploy-pages@v4
